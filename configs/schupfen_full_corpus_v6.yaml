# Schupfen-Network config — FULL corpus, featurizer v6 (ADR-0038).
#
# Pointed at the full-corpus schupfen bundle (materialised_full_v6/schupfen).
# train_schupfen STREAMS it via iter_batches — the full slice is ~88M rows, so
# the old `materialize: true` list path would OOM. `materialize` is ignored for
# memmap.
#
# Identical arch/hyperparameters to configs/schupfen_full_corpus_v5.yaml — the
# only deltas are the v6 bundle path and this header. Run from the worktree with
# src first on PYTHONPATH so the v6 featurizer is used (a sibling worktree
# shadows the import otherwise); the job hard-errors on a v5/v6 pin mismatch.
#
# NB (v6): schupfen_received is structurally all-zero at the Schupfen Decision
# (the seat decides what to GIVE before receiving), so the new self-only
# provenance section is a dead-but-harmless passenger for this net — it earns
# its keep only on the Tichu-Call and Play heads. See ADR-0038.
dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_full_v6\schupfen

model:
  hidden: 256
  skill_dim: 64

learning_rate: 3.0e-4
batch_size: 1024
epochs: 4
seed: 0

# Shuffle the training pass each epoch. Cheap in-place permutation (the slice is
# in memory).
shuffle: true
