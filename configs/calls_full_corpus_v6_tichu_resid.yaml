# Tichu Call-Network config — FULL corpus, featurizer v6, RESIDUAL trunk.
#
# A/B sibling of configs/calls_full_corpus_v6.yaml. ONLY delta: the model block
# (residual 512x4 trunk). Train with `--only tichu` — the capacity probe
# (DEBUG-cap7e2) showed the residual trunk helps the Tichu call (+0.007 AUC /
# -0.015 NLL held-out) but does NOTHING for Grand Tichu (information-limited:
# all arms identical). So GRAND stays at the existing 256x2 checkpoint; only
# the Tichu net is retrained here.
#
#   train_calls --config configs/calls_full_corpus_v6_tichu_resid.yaml \
#               --run-dir data/runs/calls_full_corpus_v6_tichu_resid --only tichu
#
# Run from the worktree with src first on PYTHONPATH (v6 featurizer).
dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_full_v6\calls

model:
  hidden: 512
  depth: 4
  residual: true
  skill_dim: 64

learning_rate: 3.0e-4
batch_size: 1024
epochs: 4
checkpoint_every: 5000
seed: 0

shuffle: true

val_frac: 0.1
