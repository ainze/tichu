# Trunk-capacity probe, DEPTH arm: 1024 x 8 (vs the 1024 x 4 baseline).
#
# One of three arms re-testing the closed trunk-capacity question at featurizer
# v6 (591 dims) — the 2026-06-02 verdict ("label-bound, not capacity-bound; do
# not touch the trunk") was measured on v4 features (224 dims) and top-1
# accuracy; v6's content (played_by, schupfen_received, negative-info) may have
# raised the learnable ceiling. Pre-registered design, bar, and PERMANENT
# closing rule: docs/notes/2026-07-03-trunk-capacity-probe-v6-preregistration.md
#
# IDENTICAL to configs/bc_full_corpus_v6_wishfix_memmap.yaml in bundle / LR /
# batch / seed / shuffle / head_weights — the ONLY delta is trunk_depth 4 -> 8.
# Same seed + shuffle => same example order as the finished baseline run
# (data\runs\bc_full_corpus_v6_wishfix_memmap), so trailing-window loss_play is
# a PAIRED comparison. Trained from scratch (shape mismatch forbids warm-start).
#
# Run (foreground; sequential with the other arms — no concurrent heavy jobs,
# ADR-0034 OOM):
#   $env:PYTHONPATH = "C:\workbench\tichu\.claude\worktrees\epic-golick-b8678d\src"
#   python -c "import tichu_training.featurizer as f; print(f.FEATURIZER_VERSION)"   # must print v6
#   python -m tichu_training.cli.train_bc `
#     --config  configs\bc_full_corpus_v6_wishfix_trunk_1024x8_memmap.yaml `
#     --run-dir C:\workbench\tichu\data\runs\bc_full_corpus_v6_wishfix_trunk_1024x8_memmap `
#     --device  cuda -v

dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_full_v6_wishfix\bc

model:
  trunk_hidden: 1024
  trunk_depth: 8            # <-- the ONLY arch delta vs baseline
  trunk_out_dim: 512
  skill_dim: 64
  head_hidden: 256

learning_rate: 3.0e-4
batch_size: 1024
epochs: 1
head_weights:
  play: 1.0
  wish: 0.3
  dragon_assignment: 0.2

shuffle: true
shuffle_buffer: 1048576
shuffle_block: 65536

checkpoint_every: 100000
checkpoint_every_batches: 50000
seed: 0
