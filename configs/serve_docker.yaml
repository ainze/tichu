# Docker serving spec (ADR-0027). ONE checkpoint serves all ML tiers; Difficulty
# is expressed by the Skill Decile fed to the Skill Embedding, not by a separate
# checkpoint. `easy` stays the RuleAgent baseline (ADR-0003).
#
# Paths are CONTAINER paths. The build (docker/build.ps1) bakes the selected
# export dir into /app/models/, so these paths are stable regardless of which
# model was bundled. All three ML tiers point at the SAME files, so the serve
# builder loads each artifact once and shares it (one Model in memory).
#
# Bundled model: cotrain_wish_v5 (full-stack co-training + Mahjong-wish head,
# ADR-0034; iter-6225, +8.37 team-rel pts/round vs master @ 20k). The wish head
# rides inside policy.pt (the play net's trunk) — no extra artifact to serve.
# Tier -> Skill Decile: medium=3, hard=6, master=9 (ascending strength); the
# policy was co-trained at decile 9, so master@9 is full shipped strength.

_shared_nets: &shared_nets
  schupfen:   /app/models/schupfen.pt
  tichu_call: /app/models/tichu_call.pt
  grand_call: /app/models/grand_tichu_call.pt

agents:
  easy:
    factory: rule
  medium:
    factory: ml
    checkpoint: /app/models/policy.pt
    skill_decile: 3
    <<: *shared_nets
  hard:
    factory: ml
    checkpoint: /app/models/policy.pt
    skill_decile: 6
    <<: *shared_nets
  master:
    factory: ml
    checkpoint: /app/models/policy.pt
    skill_decile: 9
    <<: *shared_nets

port: 8000
