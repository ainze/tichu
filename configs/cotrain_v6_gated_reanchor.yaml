# Validated-escape fork: champion gate + re-anchor-on-promote. The synthesis of the
# play-improvement arc.
#
# Two deltas vs configs/cotrain_v6_gated.yaml: promotion_gate gains
# `reanchor_on_promote: true`, AND the play KL target is widened 0.02 -> 0.08 so each
# validated leg is a BIGGER ball around the champion (faster escape per promotion;
# the gate still validates each step, so the wider exploration is degeneracy-checked).
# (+ a fresh run_dir.)
#
# WHY: cotrain_v6_gated (gate, fixed BC anchor) STALLED — it ratcheted the OPPONENT
# (champion) but the learner stayed KL-capped at 0.02 from the ORIGINAL BC, so the
# champion reached the in-ball optimum (~the +8.75 baseline) and the learner couldn't
# beat it (margins flat/negative from iter ~40; see that run's promotion_gate.csv).
# The ungated reanchor_play_every run did the opposite — it moved the anchor and left
# the ball, but blindly, and REGRESSED to +1.27 (entropy collapse / degenerate drift).
# This run combines the two correctly: on each VALIDATED promotion, the play KL anchor
# follows the champion, so the learner leaves the BC ball — but only on a CI-confirmed
# win. Validated escape, not blind escape.
#
# The complete arc:
#   fixed cap (cotrain_v6)            -> +8.75   (stable in-ball optimum)
#   ungated reanchor (play_reanchor) -> +1.27   (left the ball, degraded)
#   gate, fixed anchor (gated)       -> stalls   (validated, never leaves the ball)
#   gate + reanchor-on-promote (HERE)-> the test: can it clear +8.75 cleanly?
#
# JUDGE the same way: promotion_gate.csv (does it keep promoting past the in-ball
# optimum?) + check_cotrain mean vs the +8.75 baseline + the move-prediction DRIFT
# flag. Now that the anchor moves, watch play_entropy — if it collapses like the
# ungated run (0.246) AND drift craters, the validation wasn't enough; if it stays
# healthy and the mean clears +8.75, the validated escape worked.
#
# Optional: add `freeze_nets: [schupfen, tichu, grand]` for a play-only validated
# escape. Parallel-only; run AFTER stopping other runs (OOM, ADR-0034).

warm_start:
  play:     C:\workbench\tichu\data\runs\bc_full_corpus_v6_memmap\checkpoints\step_e000_b01250000.bin
  schupfen: C:\workbench\tichu\data\runs\schupfen_full_corpus_v6\checkpoints\schupfen_final.bin
  tichu:    C:\workbench\tichu\data\runs\calls_full_corpus_v6\checkpoints\tichu_final.bin
  grand:    C:\workbench\tichu\data\runs\calls_full_corpus_v6\checkpoints\grand_final.bin

run_dir: C:\workbench\tichu\data\runs\cotrain_v6_gated_reanchor

# Champion gate WITH anchor-follow: on a validated promotion, also move the play KL
# anchor onto the new champion so the learner can keep leaving the BC ball.
promotion_gate:
  enabled:             true
  window_games:        4096
  threshold:           0.0
  bootstrap_iters:     1000
  reanchor_on_promote: true

model:          { skill_dim: 64, trunk_hidden: 1024, trunk_depth: 4, trunk_out_dim: 512, head_hidden: 256 }
schupfen_model: { skill_dim: 64, hidden: 256 }
call_model:     { skill_dim: 64, hidden: 256 }

critic: { hidden: 1024, depth: 3, warmup_iters: 20, warmup_epochs: 3 }
perfect_info: true

update_device: cuda

rollout_workers: 10

league:
  enabled:        false
  snapshot_every: 50
  max_snapshots:  3

cotrain_wish: false

kl:
  play:     { coef: 1.0, target: 0.08,  factor: 2.0 }
  schupfen: { coef: 1.0, target: 0.008, factor: 2.0, target_final: 0.025, anneal_start: 750, anneal_iters: 2000 }
  tichu:    { coef: 1.0, target: 0.02,  factor: 2.0 }
  grand:    { coef: 1.0, target: 0.02,  factor: 2.0 }

entropy: { play: 0.01, schupfen: 0.01, tichu: 0.01, grand: 0.01 }

snapshot_every: 25

eval:
  starting_position_pool: C:\workbench\tichu\data\full_position_pool_s0_n20000.parquet
  n_deals:        4000
  bootstrap_iters: 1000
  seed:           0
  workers:        8       # do NOT run while training is using the CPU (OOM, ADR-0034)
  master:
    checkpoint_path: C:\workbench\tichu\data\export\bc_full_corpus_v6_memmap\policy.pt
    schupfen_path:   C:\workbench\tichu\data\export\bc_full_corpus_v6_memmap\schupfen.pt
    tichu_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v6_memmap\tichu_call.pt
    grand_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v6_memmap\grand_tichu_call.pt

ppo:
  iterations:         100000   # ceiling; resume continues
  positions_per_iter: 512
  pool_seed:          0
  gamma:              1.0
  lam:                0.95
  clip_eps:           0.1
  vf_coef:            0.5
  ppo_epochs:         3
  policy_lr:          1.0e-4
  critic_lr:          1.0e-3
  skill_decile:       9
  learner_team:       0
