# Belief ablation — Tier A (floor): policy 224 features only (ADR-0028).
#
# The three tiers (A / B_core / B_full) read the SAME materialised B-full bundle
# and select the input by column prefix via `tier:` — one materialise, three
# trainings. See ADR-0028.
#
# Prereq — materialise the B-full belief bundle (pick --subset so the bundle
# fits RAM; train_belief loads it whole). ~3000 games ≈ a few M examples:
#   py -3.14 -m tichu_training.cli.parse_bsw `
#     --archive        C:\workbench\tichu\data\archive.zst `
#     --output         C:\workbench\tichu\data\parquet_belief_gate_v5 `
#     --bundle-out-dir C:\workbench\tichu\data\materialised_belief_gate_v5 `
#     --bundle-tasks   belief `
#     --subset         3000 `
#     --workers        10
#
# Run (A, then swap config for B_core / B_full):
#   py -3.14 -m tichu_training.cli.train_belief `
#     --config configs\belief_v5_gate_A.yaml `
#     --run-dir C:\workbench\tichu\data\runs\belief_gate_A -v
#
# Compare epoch.csv loss (masked BCE) + accuracy across A / B_core / B_full and
# against the naive floor (scripts/belief_naive_baseline.py). B_core < A proves
# the decline channel earns its bytes; B_full < B_core proves play-time does.

dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_belief_gate_v5\belief

tier: A

model:
  hidden: 256

learning_rate: 1.0e-3
batch_size: 1024
epochs: 8
seed: 0
