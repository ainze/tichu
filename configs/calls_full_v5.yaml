# Production Call-Network config — 100k, featurizer v5 (ADR-0022).
#
# Reads the packed calls bundle that the consolidated parse pass writes
# (materialised_100k_v5/calls, ADR-0020) — no archive re-replay. train_calls
# reads its type's slice (call_tichu / call_grand_tichu) from this one dir, so
# `workers` is gone: the bundle is read sequentially from the main process.
# `materialize: true` loads the (tiny) calls slice into a list once.
dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_100k_v5\calls
  materialize: true

model:
  hidden: 256
  skill_dim: 64

learning_rate: 3.0e-4
batch_size: 1024
epochs: 4
checkpoint_every: 5000
seed: 0

# Game-level holdout (whole games on one side; split by game_id). Per-epoch
# val loss/accuracy/AUC logged to <tag>_val.csv. Matches calls_full.yaml.
val_frac: 0.1
