# Behavioral Drift Benchmark (CONTEXT.md): HOW the v7 champion plays vs its BC.
#
# Subject = the shipped champion, cotrain_v7_gated iter_15360 (promotion #6).
# BC      = the champion's own WARM-START stack — every net exactly as the co-train
#           run started from it (v7 play BC + widened schupfen/tichu/grand). NOT the
#           run's `_bc_opponent.pt` / `_gate_export/opp_bc`: under
#           `reanchor_on_promote` those capture the play ANCHOR at gate-setup time,
#           not the BC (812-logit diff measured on the wishfix run). Export it once:
#
#   py -3.14 -m scripts.export_rollout_weights --warm-start `
#     --config configs/cotrain_v7_gated.yaml `
#     --out C:\workbench\tichu\data\export\bc_v7_warmstart_cotrain_v7_gated
#
# Both greedy at Skill Decile 9 (the co-train's only decile), full v7 features.
#
# ORDER OF OPERATIONS — the A/A Null Run gates reading the real result:
#   1. py -3.14 -m tichu_training.cli.drift_benchmark --config configs/drift_v7_iter15360.yaml --aa
#      PASS = no Δ survives BH, ~95%+ of Δ CIs cover 0, game win_rate ~ 50%.
#   2. py -3.14 -m tichu_training.cli.drift_benchmark --config configs/drift_v7_iter15360.yaml
#   3. (new metric / other floor) ... --from-log   re-summarises without replaying.
#
# ENV: this worktree's src MUST be first on PYTHONPATH (editable-install shadowing).

subject:
  name: champion-v7-iter15360
  factory: ml
  kwargs:
    checkpoint_path: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_15360\policy.pt
    schupfen_path:   C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_15360\schupfen.pt
    tichu_call_path: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_15360\tichu_call.pt
    grand_call_path: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_15360\grand_tichu_call.pt
    skill_decile: 9

bc:
  name: bc-v7-warmstart
  factory: ml
  kwargs:
    checkpoint_path: C:\workbench\tichu\data\export\bc_v7_warmstart_cotrain_v7_gated\policy.pt
    schupfen_path:   C:\workbench\tichu\data\export\bc_v7_warmstart_cotrain_v7_gated\schupfen.pt
    tichu_call_path: C:\workbench\tichu\data\export\bc_v7_warmstart_cotrain_v7_gated\tichu_call.pt
    grand_call_path: C:\workbench\tichu\data\export\bc_v7_warmstart_cotrain_v7_gated\grand_tichu_call.pt
    skill_decile: 9

pool_seed: 0
n_deals: 20000     # x3 Rounds per deal (2 Subject-arm halves + 1 BC game) = 60,000 Rounds
workers: 10
n_boot: 2000
floor: 200         # suppress a cell with < 200 opportunities in either arm
output_dir: C:\workbench\tichu\data\runs\behavioral_drift_v7_iter15360

# Human reference columns (unpaired; see CONTEXT.md). Replayed once from the BSW
# archive and cached under <output_dir>/human/<group>/ — delete a cache to redo it.
# "top 10%" = both partners of the measured team at Skill Decile 9, the decile the
# BC and the champion are conditioned on.
human:
  source:  C:\workbench\tichu\data\archive.zst
  ratings: C:\workbench\tichu\data\ratings_full.parquet
  groups:
    # sample_games: spread over the WHOLE archive, sized to just cover n_rounds
    # (~9.5 Rounds/Game; ~5.6% of Rounds have a top-decile team).
    - {name: humans (all),      n_rounds: 12000, sample_games: 1400}
    - {name: humans (top 10%),  n_rounds: 8000,  sample_games: 16000, min_decile: 9}
