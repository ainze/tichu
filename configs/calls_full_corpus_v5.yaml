# Call-Network config — FULL corpus, featurizer v5 (ADR-0022).
#
# Pointed at the full-corpus calls bundle (materialised_full_v5/calls).
# train_calls reads its type's slice (call_tichu / call_grand_tichu) from this
# dir and STREAMS it via iter_batches — the full slice is ~88M rows per call
# type (~100 GB as Python objects), so the old `materialize: true` list path
# would OOM. `materialize` is now ignored for memmap; the val holdout is a
# game_id hash split carved from the stream (no up-front materialisation).
dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_full_v5\calls

model:
  hidden: 256
  skill_dim: 64

learning_rate: 3.0e-4
batch_size: 1024
epochs: 4
checkpoint_every: 5000
seed: 0

# Shuffle the training pass each epoch — see the no-shuffle note above. The
# calls slice is small and in memory, so this is a cheap in-place permutation
# (no shuffle-buffer machinery like BC needs). The game_id val split is
# unaffected (it hashes on game_id, already recency-balanced).
shuffle: true

# Game-level holdout (whole games on one side; split by game_id). Per-epoch
# val loss/accuracy/AUC logged to <tag>_val.csv.
val_frac: 0.1
