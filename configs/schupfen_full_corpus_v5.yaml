# Schupfen-Network config — FULL corpus, featurizer v5 (ADR-0022).
#
# Pointed at the full-corpus schupfen bundle (materialised_full_v5/schupfen).
# train_schupfen STREAMS it via iter_batches — the full slice is ~88M rows
# (~100 GB as Python objects), so the old `materialize: true` list path would
# OOM. `materialize` is now ignored for memmap.
dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_full_v5\schupfen

model:
  hidden: 256
  skill_dim: 64

learning_rate: 3.0e-4
batch_size: 1024
epochs: 4
seed: 0

# Shuffle the training pass each epoch — see the no-shuffle note above.
# Cheap in-place permutation (the slice is in memory).
shuffle: true
