# Is the -5.4 call-bonus deficit INHERITED from the BC, or GENERATED by co-training?
#
# The decisive question for everything downstream. The wishfix lineage's champion
# reads +0.137 total against the served export from +5.49 card play and -5.35 call
# bonus, and both call-head chimeras showed the HEADS are equivalent in either
# context (+0.57 / -0.50, both straddling zero) — so the deficit is the play
# policy's ability to convert calls.
#
# The live restart then measured the drift rate directly: against a FROZEN champion,
# call_bonus -0.675 [-1.277, -0.073] over 3,200 iterations, CI-clean negative, while
# card_play was not significant. Extrapolated over the previous run's length:
#     -0.675 * (27000 / 3200) = -5.70   vs the observed -5.35
# i.e. the measured drift rate accounts for essentially the whole deficit. And the
# rate is unchanged by a 6x tighter leash (0.12 -> 0.02), so it is not a leash
# phenomenon.
#
# That extrapolation is linear and rests on one borderline CI. THIS config tests it
# end-on instead of by extrapolation:
#
#   bc_wishfix vs served    -> if call bonus is already ~-5.4 at iteration ZERO, the
#                              deficit is INHERITED and the co-training drift story
#                              is wrong: fix the corpus / BC, not the play objective.
#                           -> if it is ~0, the deficit was GENERATED across 27k
#                              iterations at the rate just measured, and the play
#                              objective is the target.
#   candidate vs served     -> validity anchor; must reproduce ~+5.49 / -5.35.
#   bc_wishfix vs candidate -> the change attributable to those 27k iterations,
#                              measured directly rather than by difference of two
#                              other pairs (head-to-head margins do not compose —
#                              a 2.4-point non-transitivity was already observed in
#                              the chimera run).
#
# PROVENANCE — read before trusting the bc arm. `bc_wishfix` is exported from the
# four `warm_start` checkpoints this lineage actually started from, NOT from the
# run's `_bc_opponent.pt`. That file is written lazily (`if not exists`) at gate
# setup, so under `reanchor_on_promote` a resume after a promotion captures the
# ANCHOR rather than the BC — measured, its play net differs from the BC export by
# max|logit diff| 812. The export used here is bit-identical (0.000e+00) to the
# standalone BC play export, verified head by head. Regenerate with:
#     py -m scripts.export_rollout_weights --warm-start \
#         --config configs/cotrain_v6_pbrs_resid_wish_gated_wishfix.yaml \
#         --out data/export/bc_wishfix_warmstart
#
# NB `data/export/bc_wishfix_fourNet` is the REJECTED export from _bc_opponent.pt.
# It is not the BC. Do not reference it; delete when convenient.
#
# 3 pairs x 10000 deals x2 arrangements, ~50 min at 10 workers. The effect under
# test is ~5 points against a paired CI of roughly +-1.2, so this is heavily
# over-powered on purpose — a null here has to be believable.
#
#   py -m tichu_training.cli.eval_matrix --config configs/eval_tournament_bc_vs_served_calls.yaml --mode tournament -v

variant: full_strength
starting_position_pool: C:\workbench\tichu\data\full_position_pool_s0_n20000.parquet
n_deals: 10000
bootstrap_iters: 2000
paired_ci: true
seed: 0
workers: 10

agents:
  # The wishfix BC — iteration ZERO of the lineage, before any co-training.
  - name: bc_wishfix
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\export\bc_wishfix_warmstart\policy.pt
      schupfen_path:   C:\workbench\tichu\data\export\bc_wishfix_warmstart\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\export\bc_wishfix_warmstart\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\export\bc_wishfix_warmstart\grand_tichu_call.pt
      skill_decile: 9

  # iter 27,008 — 27k iterations of co-training later. Same export the 40k ship
  # check measured, so its row is directly comparable to +0.137 / +5.49 / -5.35.
  - name: candidate_iter27008
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_wishfix\_ship_check_export\policy.pt
      schupfen_path:   C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_wishfix\_ship_check_export\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_wishfix\_ship_check_export\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_wishfix\_ship_check_export\grand_tichu_call.pt
      skill_decile: 9

  # The served export — the fixed external reference every margin is quoted against.
  - name: served_cpfix3328
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_cpfix\export\iter_03328\policy.pt
      schupfen_path:   C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_cpfix\export\iter_03328\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_cpfix\export\iter_03328\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\runs\cotrain_v6_pbrs_resid_wish_gated_cpfix\export\iter_03328\grand_tichu_call.pt
      skill_decile: 9

output: C:\workbench\tichu\data\runs\eval_bc_vs_served_calls\matrix.parquet
