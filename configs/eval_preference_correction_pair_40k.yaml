# Tournament-measured -18.2 in June) suggests the Tournament magnifies offline
# magnitude ~3.7x. Expect roughly -1. CI_lo > 0 vs cpfix3328 is the ship bar;
# a clean negative closes the delivery-mechanism question per the kill ladder.
#
#   ~3.4 h at ~10 pos/s. Do NOT run a second tournament concurrently (OOM, ADR-0034).

