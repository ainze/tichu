# Full-strength Tournament: the ADR-0033 A/B decider — does the Perfect-Info
# Critic (asymmetric, 392-dim) make PPO Refine WIN where the symmetric critic
# (flat, +2.1 CI [-4.74,+9.08]) did not?
#
# pi_iter160 = perfect-info sharpened play policy (iter 163 run, snapshot 160),
# reusing master's frozen schupfen/call nets. ppo_flat_iter150 = the symmetric
# sharpened run, the direct A/B referent. master/bc_neutral = the BC the runs
# sharpened (decile 9 vs neutral, RPS guard). rule/random anchor the scale.
#
# Run (parallel; workers spawn fresh, keep PYTHONPATH on the env):
#   py -3.14 -m tichu_training.cli.eval_matrix --config configs/eval_tournament_ppo_perfect_info.yaml -v

variant: full_strength
starting_position_pool: C:\workbench\tichu\data\full_position_pool_s0_n2000.parquet
n_deals: 2000
bootstrap_iters: 1000
seed: 0
workers: 10

agents:
  - name: pi_iter160
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\export\ppo_v5_perfect_info_iter160\policy.pt
      schupfen_path:   C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\grand_tichu_call.pt
      skill_decile: 9

  - name: ppo_flat_iter150
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\export\ppo_v5_iter150\policy.pt
      schupfen_path:   C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\grand_tichu_call.pt
      skill_decile: 9

  - name: master
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\policy.pt
      schupfen_path:   C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\grand_tichu_call.pt
      skill_decile: 9

  - name: bc_neutral
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\policy.pt
      schupfen_path:   C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\grand_tichu_call.pt

  - name: rule
    factory: rule
    kwargs: {}

  - name: random
    factory: random
    kwargs:
      seed: 0

output: C:\workbench\tichu\data\runs\ppo_v5_perfect_info\tournament_iter160.parquet
