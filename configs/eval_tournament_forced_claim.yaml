# EV-probe (ADR-0032): does executing a chain Guaranteed Out gain over the master?
# forced_claim = master that, leading a fresh trick as a Tichu/Grand caller OR with its
# partner the sole player out (a live Slam), forces the first combo of a provable chain
# Guaranteed Out. Head-to-head EV vs the bare master over the full pool. No search either
# side, so 2000 deals (seat-swapped -> n=4000) is cheap and gives a tight read.
#   forced_claim EV > master  -> the master fumbles guaranteed outs; the Claim Solver is +EV
#   forced_claim EV <= master -> the master already converts them (no located gap here)
variant: full_strength
starting_position_pool: C:\workbench\tichu\data\full_position_pool_s0_n2000.parquet
n_deals: 2000
bootstrap_iters: 1000
seed: 0
workers: 6

agents:
  - name: forced_claim
    factory: forced_claim
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\policy.pt
      schupfen_path:   C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\grand_tichu_call.pt
      skill_decile: 9

  - name: master
    factory: ml
    kwargs:
      checkpoint_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\policy.pt
      schupfen_path:   C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\schupfen.pt
      tichu_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\tichu_call.pt
      grand_call_path: C:\workbench\tichu\data\export\bc_full_corpus_v5_memmap_unshuffled\grand_tichu_call.pt
      skill_decile: 9

output: C:\workbench\tichu\data\runs\forced_claim\tournament.parquet
