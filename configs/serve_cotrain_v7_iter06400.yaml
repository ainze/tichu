# Native serve spec for the v7 champion: cotrain_v7_gated, iter_06400.
#
# THE FIRST v7 SERVING BUNDLE. iter_06400 is the last GATE-PROMOTED champion —
# promoted with cpfix3328 (the currently deployed export) at +6.107, ci_lo +5.046
# over 81,920 seat-swapped games, alongside +13.800 vs the v7 BC. It is the last
# policy the greedy gate certified, not the newest snapshot: the run has held
# without promotion since, so a later snapshot would be un-certified.
#
# Featurizer v7 (824 dims), and policy.pt is stamped `use_legal_mask` — MLAgent
# reads that stamp and feeds the 1809-wide legal-Intent mask as a trunk input
# (ADR-0044). Serving it with a v6 loader, or with an MLAgent that ignores the
# stamp, would feed 1809 zeros where training saw the legal set.
#
# --require-v7 : NOT YET. The wire client still omits public.rich_history, so
# turning strict mode on today would 400 every request. Order of operations:
#   1. ship the client change,
#   2. confirm rich_history is arriving,
#   3. THEN restart with --require-v7.
# Until step 3 this policy runs with its 233 Rich History dims pinned to zero —
# it will serve, but below strength, and nothing in any metric will say so.
# GET /health reports `requires_v7` so the client can check where it stands.
#
# Single checkpoint serves all ML tiers; Difficulty = the Skill Decile fed to the
# Skill Embedding (ADR-0027). `easy` is the RuleAgent baseline (ADR-0003).
# Tier -> Skill Decile: medium=3, hard=6, master=9 (ascending strength).
#
# NOTE the co-train trained at skill_decile 9 only (`ppo.skill_decile: 9`), so the
# medium/hard tiers are the same nets read at a decile the RL never optimised.
# That is unchanged from every previous cotrain serve spec, not new here.

_shared_nets: &shared_nets
  schupfen:   C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_06400\schupfen.pt
  tichu_call: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_06400\tichu_call.pt
  grand_call: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_06400\grand_tichu_call.pt

agents:
  easy:
    factory: rule
  medium:
    factory: ml
    checkpoint: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_06400\policy.pt
    skill_decile: 3
    <<: *shared_nets
  hard:
    factory: ml
    checkpoint: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_06400\policy.pt
    skill_decile: 6
    <<: *shared_nets
  master:
    factory: ml
    checkpoint: C:\workbench\tichu\data\runs\cotrain_v7_gated\export\iter_06400\policy.pt
    skill_decile: 9
    <<: *shared_nets

port: 8000
