# Production Schupfen-Network config — 100k, featurizer v5 (ADR-0022).
#
# Reads the packed schupfen bundle from the consolidated parse pass
# (materialised_100k_v5/schupfen, ADR-0020) — no archive re-parse to rebuild
# the synthetic pre-schupfen state. `workers` is gone (sequential read);
# `materialize: true` loads the slice into a list once for multi-epoch training.
dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_100k_v5\schupfen
  materialize: true

model:
  hidden: 256
  skill_dim: 64

learning_rate: 3.0e-4
batch_size: 1024
epochs: 4
seed: 0
