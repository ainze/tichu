# Production Schupfen-Network config — 100k, featurizer v5 (ADR-0022).
#
# NOTE: like calls_full_v5, train_schupfen still consumes the parquet manifest
# (ParquetSchupfenDataset re-parses the archive + builds the synthetic
# pre-schupfen state). The packed schupfen bundle parse_bsw now writes
# (materialised_100k_v5/schupfen) is NOT yet read by train_schupfen — memmap
# consumption is a follow-up.
dataset: parquet
dataset_kwargs:
  shards_dir: C:/workbench/tichu/data/parquet_100k_feat_v5
  archive_path: C:/workbench/tichu/data/archive.zst
  ratings_path: C:/workbench/tichu/data/ratings_100k.parquet
  expected_featurizer_version: v5
  expected_action_space_version: v1
  workers: 10
  materialize: true

model:
  hidden: 256
  skill_dim: 64

learning_rate: 3.0e-4
batch_size: 1024
epochs: 4
seed: 0
