# BC training on the FULL corpus packed bundle, featurizer v5 (ADR-0020/0022).
#
# Same bc_full arch (1024x4 trunk, 256-hidden heads, 64-dim skill) and
# hyperparameters as configs/bc_full_100k_v5_memmap.yaml — the only deltas are
# the bundle path (the full materialised_full_v5/bc slice) and the checkpoint
# cadence, retuned for the much larger epoch. Holding arch/LR/batch/seed
# constant against the 100k run lets a quality delta attribute cleanly to data
# scale (100k games -> full corpus).
#
# Corpus size (materialised_full_v5/bc manifest):
#   play  1,248,160,023
#   wish     18,137,682
#   dragon   19,887,678
#   total 1,286,185,383 examples  (~100x the 100k bundle)
# At batch_size 1024 that's ~1.256M batches in a single epoch. On the CUDA
# memmap fast path (~130k ex/s on this box at v4/v5) one epoch is roughly
# 2.5-3 h of pure compute; budget more for checkpoint writes + I/O warmup.
#
# Prereq (already done by the user): one parse pass emitting the parquet
# manifest + the bc/calls/schupfen bundles:
#   py -3.14 -m tichu_training.cli.parse_bsw `
#     --archive        C:\workbench\tichu\data\archive.zst `
#     --output         C:\workbench\tichu\data\parquet_full_feat_v5 `
#     --bundle-out-dir C:\workbench\tichu\data\materialised_full_v5 `
#     --bundle-tasks   all `
#     --trueskill      C:\workbench\tichu\data\ratings_full.parquet `
#     --workers        10
#
# Use (run from the worktree with src on PYTHONPATH so the multi-bundle code
# shadows any pip-installed copy):
#   py -3.14 -m tichu_training.cli.train_bc `
#     --config  configs\bc_full_corpus_v5_memmap.yaml `
#     --run-dir C:\workbench\tichu\data\runs\bc_full_corpus_v5_memmap `
#     --device  cuda -v

dataset: memmap
dataset_kwargs:
  data_dir: C:\workbench\tichu\data\materialised_full_v5\bc

model:
  trunk_hidden: 1024
  trunk_depth: 4
  trunk_out_dim: 512
  skill_dim: 64
  head_hidden: 256

learning_rate: 3.0e-4
batch_size: 1024
epochs: 1
head_weights:
  play: 1.0
  wish: 0.3
  dragon_assignment: 0.2

# REQUIRED at full-corpus scale. The bundle is emitted in game_id order and
# sample_weight is a recency weight that flips 0.5 -> 1.0 at game_id
# 1,855,844 (parse_bsw --recency-cutoff-game-id). Unshuffled, training crosses
# that boundary at ~78% of the epoch: the weighted loss + effective LR double
# and the run becomes old-meta-only then recent-meta-only (biasing the final
# 1-epoch checkpoint). Shuffling interleaves old/recent into weight-mixed,
# ~i.i.d. batches. The 100k configs never hit this — their subset is entirely
# below the cutoff (uniform weight 0.5), which is why it only shows at full
# scale. block/buffer are two-level knobs: large block keeps order.dat reads
# near-sequential; buffer controls within-batch mixing. Defaults below mix
# ~16 random 64k-row blocks at a time (~1M rows of indices, negligible RAM).
shuffle: true
shuffle_buffer: 1048576           # rows held per drain (within-batch mixing)
shuffle_block: 65536              # contiguous order.dat rows per read (I/O locality)

checkpoint_every: 100000           # won't fire — epochs=1
checkpoint_every_batches: 50000    # ~51M ex per save (~6-7 min on the fast path),
                                   # ~25 mid-epoch checkpoints for resume / AWR targets
seed: 0
